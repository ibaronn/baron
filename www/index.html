<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>GeoQuiz Globe</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-panel: rgba(16, 20, 31, 0.92);
      --line: #232c42;
      --fg: #e6ebf5;
      --fg-dim: #8b96ad;
      --accent: #4fc3f7;
      --ok: #2ecc71;
      --warn: #f1c40f;
      --bad: #e74c3c;
      --card: #141a2b;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; color: var(--fg); }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; position: relative; }
    #globe-container { position: fixed; inset: 0; background: transparent; }
    #globe-container canvas { display: block; }
    #hud {
      position: fixed; top: 0; right: 0; left: 0;
      padding: calc(env(safe-area-inset-top, 6px) + 12px) 16px 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      z-index: 5; pointer-events: none;
    }
    #brand { font-weight: 700; letter-spacing: 0.3px; opacity: 0.9; font-size: 16px; }
    #hud-status { font-size: 13px; color: var(--fg-dim); }
    #hud-left { display: flex; align-items: center; gap: 8px; }
    .chip {
      background: var(--bg-panel); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px 12px; font-size: 13px;
      color: var(--fg); white-space: nowrap;
    }
    #score-chip { color: var(--accent); }
    #flag-card {
      position: fixed; top: calc(env(safe-area-inset-top, 6px) + 64px);
      left: 50%; transform: translateX(-50%);
      z-index: 6; display: none; flex-direction: column; align-items: center;
      background: var(--bg-panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px 20px 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease;
    }
    #flag-card.show { display: flex; }
    #flag-card.correct { animation: card-correct 0.6s ease; border-color: var(--ok); }
    #flag-card.wrong { animation: card-wrong 0.5s ease; border-color: var(--bad); }
    #flag-card .q-label { font-size: 12px; color: var(--fg-dim); margin-bottom: 6px; }
    #flag-img {
      width: 116px; height: auto; border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    #flag-progress { margin-top: 8px; font-size: 12px; color: var(--fg-dim); }
    #hint-row { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #hint-btn {
      background: transparent; color: var(--accent); border: 1px solid var(--accent);
      border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    }
    #hint-btn:disabled { opacity: 0.45; cursor: default; }
    #hint-value { font-size: 13px; color: var(--warn); min-height: 18px; }
    @keyframes card-correct {
      0% { transform: translateX(-50%) scale(1); }
      40% { transform: translateX(-50%) scale(1.06); }
      100% { transform: translateX(-50%) scale(1); }
    }
    @keyframes card-wrong {
      0% { transform: translateX(-50%); }
      20% { transform: translateX(calc(-50% + 10px)); }
      40% { transform: translateX(calc(-50% - 8px)); }
      60% { transform: translateX(calc(-50% + 6px)); }
      100% { transform: translateX(-50%); }
    }
    #toast {
      position: fixed; top: calc(env(safe-area-inset-top, 6px) + 220px);
      left: 50%; transform: translate(-50%, -4px);
      padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
      background: var(--bg-panel); border: 1px solid var(--line); color: var(--fg);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 8; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.good { border-color: var(--ok); color: var(--ok); }
    #toast.warn { border-color: var(--warn); color: var(--warn); }
    #toast.bad { border-color: var(--bad); color: var(--bad); }
    #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 29; }
    #flash.good { animation: flash-good 0.8s ease-out; }
    #flash.bad { animation: flash-bad 0.4s ease-out; }
    @keyframes flash-good {
      0% { opacity: 0.4; background: radial-gradient(circle, rgba(46, 204, 113, 0.45), transparent 70%); }
      100% { opacity: 0; }
    }
    @keyframes flash-bad {
      0% { opacity: 0.2; background: radial-gradient(circle, rgba(231, 76, 60, 0.35), transparent 70%); }
      100% { opacity: 0; }
    }
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
    .confetti {
      position: absolute; top: 34%; width: 8px; height: 14px; border-radius: 2px;
      transform: translateX(-50%); animation: confetti-pop 1.1s ease-out forwards;
    }
    @keyframes confetti-pop {
      0% { opacity: 0; transform: translate(-50%, -8vh) rotate(0deg); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), 72vh) rotate(var(--rot, 360deg)); }
    }
    #game-overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(5, 8, 16, 0.68); z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #game-overlay.show { opacity: 1; pointer-events: auto; }
    #summary-card {
      background: var(--bg-panel); border: 1px solid var(--line);
      border-radius: 18px; padding: 28px 34px; text-align: center;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45); max-width: 86vw;
    }
    #summary-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    #summary-score { font-size: 40px; font-weight: 800; color: var(--accent); margin: 8px 0; }
    #summary-sub { font-size: 14px; color: var(--fg-dim); margin-bottom: 12px; line-height: 1.6; }
    #summary-best { font-size: 13px; color: var(--accent); margin-bottom: 20px; }
    #new-round-btn {
      background: var(--accent); color: #062033; border: none; border-radius: 999px;
      padding: 12px 26px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    #diag-trigger {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 6px) + 10px); right: 12px;
      z-index: 20; border: 1px solid var(--line); background: var(--bg-panel); color: var(--fg-dim);
      border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    #diag-panel {
      position: fixed; left: 8px; right: 8px;
      bottom: calc(env(safe-area-inset-bottom, 6px) + 10px);
      max-height: 45vh; overflow-y: auto; background: var(--bg-panel);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 10px 12px; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
      z-index: 19; display: none; direction: ltr; text-align: left;
    }
    #diag-panel.open { display: block; }
    #diag-panel .d-title { color: var(--fg-dim); font-weight: 600; margin-bottom: 6px; direction: rtl; }
    #diag-panel .d-line { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    #diag-panel .d-info { color: var(--fg); }
    #diag-panel .d-warn { color: var(--warn); }
    #diag-panel .d-error { color: var(--bad); }
    #diag-panel .d-ok { color: var(--ok); }
    #load-note {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: var(--fg-dim); font-size: 14px; z-index: 2; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #load-note.hidden { opacity: 0; }
    #load-note .spinner {
      width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef1f6;
        --bg-panel: rgba(255, 255, 255, 0.94);
        --line: #d4dbe8;
        --fg: #1d2433;
        --fg-dim: #5a667d;
        --card: #ffffff;
      }
    }
  </style>
</head>
<body>
  <div id="globe-container"></div>
  <div id="hud">
    <div id="brand">GeoQuiz Globe</div>
    <div id="hud-left">
      <div id="score-chip" class="chip">٠</div>
      <div id="progress-chip" class="chip">0/10</div>
      <div id="best-chip" class="chip">الأفضل: ٠</div>
      <div id="hud-status"></div>
    </div>
  </div>
  <div id="flag-card">
    <div class="q-label">أين تقع هذه الدولة؟</div>
    <img id="flag-img" alt="علم الدولة" draggable="false">
    <div id="flag-progress">١ / ١٠</div>
    <div id="hint-row">
      <button id="hint-btn" type="button">تلميح القارة (−25)</button>
      <div id="hint-value"></div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="flash"></div>
  <div id="confetti"></div>
  <div id="game-overlay">
    <div id="summary-card">
      <div id="summary-title">نهاية الجولة</div>
      <div id="summary-score">٠</div>
      <div id="summary-sub"></div>
      <div id="summary-best"></div>
      <button id="new-round-btn" type="button">جولة جديدة</button>
    </div>
  </div>
  <div id="load-note">
    <div class="spinner"></div>
    <div id="load-note-text">جارٍ التحقق من الأصول…</div>
  </div>
  <button id="diag-trigger" type="button">التشخيص</button>
  <pre id="diag-panel" aria-live="polite"></pre>

  <script src="assets/lib/globe.gl.min.js"></script>
  <script>
    'use strict';

    /* ============================================================
       1. CONFIG & DIAG — الثوابت ولوحة التشخيص المدمجة
       ============================================================ */

    var CONFIG = {
      ASSETS: {
        geo: 'assets/data/countries-110m.geojson',
        lib: 'assets/lib/globe.gl.min.js',
        imgDay: 'assets/img/earth-blue-marble.jpg',
        imgNight: 'assets/img/earth-dark.jpg'
      },
      GLOBE: {
        pixelRatio: 2,       // تُطبّقه المكتبة داخلياً (Math.min(2, devicePixelRatio)) — متحقّق
        textureSize: 2048,   // الخامات محلية وضمن هذا الحد
        textureW: 2048,
        textureH: 1024
      },
      GAME: {
        roundSize: 10,
        baseScore: 100,      // نقاط أساس القدرة على السرعة
        secPenalty: 10,      // خصم نقاط/ثانية
        hintPenalty: 25      // خصم استخدام التلميح
      }
    };

    var Diag = (function () {
      var panel = document.getElementById('diag-panel');
      var lines = [];
      var open = false;

      function render() {
        panel.classList.toggle('open', open);
        panel.innerHTML =
          '<div class="d-title">لوحة التشخيص (' + new Date().toLocaleTimeString() + ')</div>' +
          lines.map(function (l) { return l.html; }).join('');
      }

      function log(kind, message) {
        var cls = 'd-info';
        if (kind === 'warn') { cls = 'd-warn'; console.warn(message); }
        else if (kind === 'error') { cls = 'd-error'; console.error(message); }
        else { console.info(message); }
        lines.push({ html: '<div class="d-line ' + cls + '">' + message + '</div>' });
        if (lines.length > 200) { lines.shift(); }
        render();
      }

      function toggle() {
        open = !open;
        render();
      }

      return {
        info: function (m) { log('info', m); },
        warn: function (m) { log('warn', m); },
        error: function (m) { log('error', m); },
        toggle: toggle
      };
    })();

    window.addEventListener('error', function (e) {
      Diag.error('window.onerror: ' + (e && e.message || 'خطأ غير معروف'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      Diag.error('Promise رُفض بدون معالجة: ' + (e && e.reason));
    });

    document.getElementById('diag-trigger').addEventListener('click', function () {
      Diag.toggle();
    });

    /* ============================================================
       2. ASSETS LOADER — بدء التشغيل والتحقق من الأصول المحلية
       ============================================================ */

    var countryFeatures = null;
    var questionFeatures = null;

    function setStatus(text) {
      document.getElementById('hud-status').textContent = text;
    }

    function fetchLocal(url) {
      return fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) { throw new Error(url + ' → HTTP ' + r.status); }
        return r;
      });
    }

    async function boot() {
      Diag.info('بدء التشغيل — جميع الأصول محلية (Offline-ready)');

      var checks = [];
      checks.push(fetchLocal(CONFIG.ASSETS.lib).then(function (r) {
        return r.blob().then(function (b) {
          Diag.info('OK  lib/globe.gl.min.js (' + Math.round(b.size / 1024) + ' KB)');
        });
      }).catch(function (e) { Diag.error('فشل مكتبة globe.gl: ' + e.message); }));

      checks.push(fetchLocal(CONFIG.ASSETS.imgDay).then(function (r) {
        return r.blob().then(function (b) {
          Diag.info('OK  img/earth-blue-marble.jpg (' + Math.round(b.size / 1024) + ' KB)');
        });
      }).catch(function (e) { Diag.error('فشل خامة النهار: ' + e.message); }));

      checks.push(fetchLocal(CONFIG.ASSETS.imgNight).then(function (r) {
        return r.blob().then(function (b) {
          Diag.info('OK  img/earth-dark.jpg (' + Math.round(b.size / 1024) + ' KB)');
        });
      }).catch(function (e) { Diag.error('فشل خامة الليل: ' + e.message); }));

      checks.push(fetchLocal(CONFIG.ASSETS.geo).then(function (r) {
        return r.text().then(function (text) {
          var geo = JSON.parse(text);
          countryFeatures = geo.features.filter(function (f) {
            return f.properties && f.properties.iso_a2 && /^[A-Z]{2}$/.test(f.properties.iso_a2);
          });
          questionFeatures = countryFeatures.filter(function (f) {
            return f.properties.iso_a2 !== 'AQ';   // أنتاركتيكا قارة لا دولة — خارج الأسئلة
          });
          Diag.info('OK  data/countries-110m.geojson — ' +
            geo.features.length + ' ميزة مرسومة، ' + questionFeatures.length + ' دولة قابلة للعب');
        });
      }).catch(function (e) { Diag.error('فشل بيانات الحدود: ' + e.message); }));

      await Promise.all(checks);

      var globeLibReady = typeof window.Globe === 'function';
      if (globeLibReady) {
        initGlobe();
        Diag.info('عرض الكرة الأرضية اكتمل التهيئة');
      } else {
        Diag.error('كائن Globe غير متوفر — لا يمكن عرض الكرة');
      }

      if (countryFeatures && countryFeatures.length) {
        createRound();
        Diag.info('الجولة جاهزة — علم أول دولة ظاهر');
      }

      updateBestChip();
      var hasErrors = document.querySelectorAll('#diag-panel .d-error').length > 0;
      document.getElementById('load-note').classList.add('hidden');
      setStatus(hasErrors ? 'أخطاء — راجع التشخيص' : '');
    }

    document.addEventListener('DOMContentLoaded', function () {
      boot().catch(function (err) {
        Diag.error('boot فشل: ' + err.message);
        document.getElementById('load-note').classList.add('hidden');
        setStatus('أخطاء — راجع التشخيص');
      });
    });

    /* ============================================================
       3. GLOBE RENDER — globe.gl، حدود الدول، الوضع الليلي/النهاري
       ============================================================ */

    var THEMES = {
      dark: {
        bg: 'radial-gradient(circle at 50% 42%, #101a2e 0%, #050810 72%)',
        texture: 'assets/img/earth-dark.jpg',
        landCap: 'rgba(75, 100, 150, 0.45)',
        landSide: 'rgba(28, 44, 74, 0.85)',
        landStroke: 'rgba(180, 208, 255, 0.85)',
        hover: 'rgba(255, 214, 79, 0.9)',
        atmosphere: '#2f6fb0'
      },
      light: {
        bg: 'radial-gradient(circle at 50% 45%, #eef3fb 0%, #cfd9ea 70%)',
        texture: 'assets/img/earth-blue-marble.jpg',
        landCap: 'rgba(98, 143, 214, 0.55)',
        landSide: 'rgba(48, 88, 158, 0.9)',
        landStroke: 'rgba(28, 62, 120, 0.95)',
        hover: 'rgba(214, 140, 20, 0.95)',
        atmosphere: '#5f9be0'
      }
    };

    var world = null;
    var hovered = null;
    var theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';

    function currentTheme() { return THEMES[theme]; }

    function capColor(f) { return f === hovered ? currentTheme().hover : currentTheme().landCap; }
    function sideColor() { return currentTheme().landSide; }
    function strokeColor() { return currentTheme().landStroke; }
    function altit(f) { return f === hovered ? 0.05 : 0.01; }

    function applyTheme() {
      var th = currentTheme();
      document.body.style.background = th.bg;
      if (!world) { return; }
      world
        .backgroundColor('rgba(0, 0, 0, 0)')
        .globeImageUrl(th.texture)
        .atmosphereColor(th.atmosphere)
        .polygonCapColor(capColor)
        .polygonSideColor(sideColor)
        .polygonStrokeColor(strokeColor);
    }

    function initGlobe() {
      world = Globe()
        .width(window.innerWidth)
        .height(window.innerHeight)
        .backgroundColor('rgba(0, 0, 0, 0)')
        .polygonsData(countryFeatures || [])
        .polygonGeoJsonGeometry(true)
        .polygonCapColor(capColor)
        .polygonSideColor(sideColor)
        .polygonStrokeColor(strokeColor)
        .polygonAltitude(altit)
        .polygonLabel(function (f) {
          var p = f.properties || {};
          var ar = p.name_ar || '';
          var en = p.name_en || '';
          return '<div style="font-size:13px;line-height:1.45;text-align:center">' +
            '<b>' + (ar || en) + '</b>' +
            (ar && en ? '<br/><span style="opacity:.75">' + en + '</span>' : '') +
            '</div>';
        })
        .polygonsTransitionDuration(300)
        .onPolygonHover(function (f) {
          hovered = f || null;
          if (world) {
            world.polygonCapColor(capColor).polygonAltitude(altit);
          }
        })
        .onPolygonClick(handleAnswer)
        .atmosphereColor(currentTheme().atmosphere)
        .showAtmosphere(true)
        .atmosphereAltitude(0.14)
        .pointOfView({ lat: 24, lng: 40, altitude: 2.4 }, 0);

      world(document.getElementById('globe-container'));

      var controls = world.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.4;
      controls.addEventListener('start', function () {
        controls.autoRotate = false;
      });

      applyTheme();

      window.addEventListener('resize', function () {
        if (world) {
          world.width(window.innerWidth).height(window.innerHeight);
        }
      });
      window.addEventListener('orientationchange', function () {
        if (world) {
          world.width(window.innerWidth).height(window.innerHeight);
        }
      });

      var media = window.matchMedia('(prefers-color-scheme: light)');
      var onSchemeChange = function (e) {
        theme = e.matches ? 'light' : 'dark';
        applyTheme();
      };
      if (media.addEventListener) {
        media.addEventListener('change', onSchemeChange);
      } else if (media.addListener) {
        media.addListener(onSchemeChange);
      }
    }

    /* ============================================================
       4. GAME STATE — اختيار عشوائي، الجولة، احتساب النقاط
       ============================================================ */

    var ROUND_SIZE = CONFIG.GAME.roundSize;

    var Game = {
      pool: [],
      round: [],
      index: 0,
      score: 0,
      correctCount: 0,
      qStart: 0,
      answeredLock: false,
      hintUsed: false
    };

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }

    function createRound() {
      Game.pool = questionFeatures || [];
      if (Game.pool.length < ROUND_SIZE) {
        showToast('البيانات غير كافية لبدء الجولة', 'warn');
        return;
      }
      Game.round = shuffle(Game.pool).slice(0, ROUND_SIZE);
      Game.index = 0;
      Game.score = 0;
      Game.correctCount = 0;
      Game.answeredLock = false;
      hideSummary();
      if (world) {
        world.controls().autoRotate = true;
        world.pointOfView({ lat: 24, lng: 40, altitude: 2.4 }, 900);
      }
      startQuestion();
    }

    function startQuestion() {
      Game.qStart = Date.now();
      Game.hintUsed = false;
      document.getElementById('hint-value').textContent = '';
      document.getElementById('hint-btn').disabled = false;
      renderCard();
      updateHud();
    }

    function currentTarget() { return Game.round[Game.index]; }

    function computeGain() {
      var sec = (Date.now() - Game.qStart) / 1000;
      var gain = CONFIG.GAME.baseScore - Math.floor(sec * CONFIG.GAME.secPenalty);
      if (Game.hintUsed) { gain -= CONFIG.GAME.hintPenalty; }
      return Math.max(10, gain);
    }

    /* ============================================================
       5. INPUT — لمس الدولة، تقريب الكاميرا عند الخطأ
       ============================================================ */

    function countryCenter(f) {
      var p = f.properties;
      if (p && typeof p.LABEL_Y === 'number' && typeof p.LABEL_X === 'number' &&
          !isNaN(p.LABEL_X) && !isNaN(p.LABEL_Y)) {
        return { lat: p.LABEL_Y, lng: p.LABEL_X };
      }
      return { lat: 0, lng: 0 };
    }

    function handleAnswer(f) {
      if (!f || !f.properties || Game.answeredLock) { return; }
      var target = currentTarget();
      if (!target) { return; }

      if (f.properties.iso_a2 === target.properties.iso_a2) {
        Game.answeredLock = true;
        onCorrectAnswer(target);
      } else {
        onWrongAnswer(target);
      }
    }

    function onCorrectAnswer(target) {
      var gain = computeGain();
      Game.score += gain;
      Game.correctCount += 1;
      Game.answeredLock = true;
      Store.addDiscovered(target.properties.iso_a2);

      haptic('LIGHT');
      celebrate();
      flashGood();
      showToast('أحسنت! +' + gain, 'good', 1400);
      var card = document.getElementById('flag-card');
      card.classList.remove('wrong');
      card.classList.add('correct');
      card.classList.remove('show');
      updateHud();

      var c = countryCenter(target);
      if (world) {
        world.pointOfView({ lat: c.lat, lng: c.lng, altitude: 1.6 }, 1200);
      }

      setTimeout(function () {
        Game.answeredLock = false;
        Game.index += 1;
        card.classList.remove('correct');
        if (Game.index >= Game.round.length) {
          showSummary();
        } else {
          startQuestion();
        }
      }, 1000);
    }

    function onWrongAnswer(target) {
      haptic('HEAVY');
      showToast('ليست هذه الدولة', 'bad', 1200);
      var card = document.getElementById('flag-card');
      card.classList.remove('correct');
      card.classList.add('wrong');
      flashBad();

      var c = countryCenter(target);
      if (world) {
        world.pointOfView({ lat: c.lat, lng: c.lng, altitude: 1.4 }, 1800);
      }

      setTimeout(function () {
        card.classList.remove('wrong');
      }, 600);
    }

    /* ============================================================
       6. UI RENDER — بطاقة العلم، التغذية الراجعة، الملخص
       ============================================================ */

    function renderCard() {
      var target = currentTarget();
      var iso = target.properties.iso_a2.toLowerCase();
      document.getElementById('flag-img').src = 'assets/flags/' + iso + '.svg';
      document.getElementById('flag-img').alt = target.properties.name_en || target.properties.name_ar || '';
      document.getElementById('flag-progress').textContent =
        (Game.index + 1) + ' / ' + ROUND_SIZE;
      var card = document.getElementById('flag-card');
      card.classList.remove('correct', 'wrong');
      card.classList.add('show');
    }

    function updateHud() {
      document.getElementById('score-chip').textContent = Game.score;
      document.getElementById('progress-chip').textContent =
        (Game.index + 1) + '/' + ROUND_SIZE;
    }

    var toastTimer = null;
    function showToast(text, cls, ms) {
      var t = document.getElementById('toast');
      t.className = cls || '';
      t.textContent = text;
      t.classList.add('show');
      if (toastTimer) { clearTimeout(toastTimer); }
      toastTimer = setTimeout(function () {
        t.classList.remove('show');
      }, ms || 1400);
    }

    function flashGood() {
      var el = document.getElementById('flash');
      el.classList.remove('good', 'bad');
      void el.offsetWidth;
      el.classList.add('good');
    }

    function flashBad() {
      var el = document.getElementById('flash');
      el.classList.remove('good', 'bad');
      void el.offsetWidth;
      el.classList.add('bad');
    }

    var CONFETTI_COLORS = ['#4fc3f7', '#ffd64f', '#2ecc71', '#ff7b7b', '#b388ff', '#ff9b59'];

    function celebrate() {
      var shell = document.getElementById('confetti');
      shell.innerHTML = '';
      for (var i = 0; i < 28; i++) {
        var p = document.createElement('span');
        p.className = 'confetti';
        p.style.left = (Math.random() * 100) + '%';
        p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
        p.style.animationDelay = (Math.random() * 0.25) + 's';
        p.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
        p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
        shell.appendChild(p);
        (function (el) {
          setTimeout(function () { el.remove(); }, 1400);
        })(p);
      }
    }

    function haptic(kind) {
      var cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (cap) {
        cap.impact({ style: kind || 'LIGHT' }).catch(function () {});
        return;
      }
      if (navigator.vibrate) {
        navigator.vibrate(kind === 'HEAVY' ? 50 : 30);
      }
    }

    function showSummary() {
      var best = Store.getBest();
      if (Game.score > best) {
        best = Game.score;
        Store.saveBest(best);
      }
      updateBestChip();
      document.getElementById('summary-score').textContent = Game.score;
      document.getElementById('summary-sub').innerHTML =
        'أصبت ' + Game.correctCount + ' من ' + ROUND_SIZE +
        '<br>دول مكتشفة إجمالاً: ' + Store.discoveredCount() + ' من ' + Game.pool.length;
      document.getElementById('summary-best').textContent = 'أفضل نتيجة: ' + best;
      var overlay = document.getElementById('game-overlay');
      overlay.classList.add('show');
      if (world) {
        world.controls().autoRotate = true;
        world.pointOfView({ lat: 24, lng: 40, altitude: 2.4 }, 1000);
      }
    }

    function hideSummary() {
      document.getElementById('game-overlay').classList.remove('show');
    }

    document.getElementById('new-round-btn').addEventListener('click', createRound);

    /* ============================================================
       7. HINTS — تلميح القارة وخصم النقاط (متاح عند الطلب فقط)
       ============================================================ */

    var CONTINENT_AR = {
      'Africa': 'أفريقيا',
      'Asia': 'آسيا',
      'Europe': 'أوروبا',
      'North America': 'أمريكا الشمالية',
      'South America': 'أمريكا الجنوبية',
      'Oceania': 'أوقيانوسيا',
      'Antarctica': 'أنتاركتيكا'
    };

    function continentAr(continent) {
      return CONTINENT_AR[continent] || continent || 'غير معروف';
    }

    function showHint() {
      if (Game.answeredLock) { return; }
      var target = currentTarget();
      if (!target || Game.hintUsed) { return; }
      Game.hintUsed = true;
      document.getElementById('hint-value').textContent =
        'القارة: ' + continentAr(target.properties.continent);
      document.getElementById('hint-btn').disabled = true;
      haptic('LIGHT');
      showToast('استُخدم التلميح −' + CONFIG.GAME.hintPenalty, 'warn', 1400);
    }

    document.getElementById('hint-btn').addEventListener('click', showHint);

    /* ============================================================
       8. PERSISTENCE — التتبع المحلي (بدون خادم)
       ============================================================ */

    var Store = (function () {
      var K_BEST = 'gq_best_score';
      var K_DISC = 'gq_discovered';

      function ls() {
        try { return window.localStorage; } catch (e) { return null; }
      }

      function getBest() {
        var s = ls();
        if (!s) { return 0; }
        var v = parseInt(s.getItem(K_BEST) || '0', 10);
        return isNaN(v) ? 0 : v;
      }

      function saveBest(v) {
        var s = ls();
        if (!s) { return; }
        try { s.setItem(K_BEST, String(v)); } catch (e) { /* مساحة ممتلئة */ }
      }

      function getDiscovered() {
        var s = ls();
        if (!s) { return []; }
        try {
          var a = JSON.parse(s.getItem(K_DISC) || '[]');
          return Array.isArray(a) ? a : [];
        } catch (e) { return []; }
      }

      function addDiscovered(iso) {
        var s = ls();
        if (!s) { return; }
        var a = getDiscovered();
        if (a.indexOf(iso) === -1) {
          a.push(iso);
          try { s.setItem(K_DISC, JSON.stringify(a)); } catch (e) { /* مساحة ممتلئة */ }
        }
      }

      function discoveredCount() { return getDiscovered().length; }

      return {
        getBest: getBest,
        saveBest: saveBest,
        getDiscovered: getDiscovered,
        addDiscovered: addDiscovered,
        discoveredCount: discoveredCount
      };
    })();

    function updateBestChip() {
      document.getElementById('best-chip').textContent = 'الأفضل: ' + Store.getBest();
    }
  </script>
</body>
</html>
